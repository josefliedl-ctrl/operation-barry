<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BRUTUS – Systemabschaltung</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  background: black;
  color: #00ffea;
  font-family: 'Courier New', monospace;
  text-align: center;
  padding-top: 80px;
  animation: bgflash 0.8s infinite;
}

@keyframes bgflash {
  0% { background: black; }
  50% { background: #0a0a0a; }
  100% { background: black; }
}

h1 {
  font-size: 60px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #00ffee;
  animation: glitch 1s infinite;
}

@keyframes glitch {
  0% { text-shadow: 2px 2px #ff0044; }
  25% { text-shadow: -2px -2px #00ffee; }
  50% { text-shadow: 3px -3px #ff0044; }
  75% { text-shadow: -3px 3px #00ffee; }
  100% { text-shadow: 2px 2px #ff0044; }
}

#log {
  margin-top: 40px;
  font-size: 22px;
  text-align: left;
  width: 60%;
  margin-left: auto;
  margin-right: auto;
  border-left: 3px solid #00ffea;
  padding-left: 20px;
  height: 300px;
  overflow: hidden;
}

.logline {
  opacity: 0;
  animation: showline 0.5s forwards;
}

@keyframes showline {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

#missionComplete {
  margin-top: 60px;
  font-size: 50px;
  color: #00ffea;
  text-shadow: 0 0 25px #00ffee;
  opacity: 0;
  animation: mission 3s forwards;
}

@keyframes mission {
  0% { opacity: 0; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 1; transform: scale(1); }
}

#restart {
  margin-top: 40px;
  font-size: 24px;
  color: #00ffea;
  opacity: 0;
  animation: restart 4s forwards;
}

@keyframes restart {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

a {
  color: #00ffee;
  text-decoration: none;
  font-size: 26px;
}
</style>

<script>
let lines = [
  ">> BRUTUS SYSTEM SHUTDOWN INITIALISIERT",
  ">> Sicherheitsprotokolle werden deaktiviert...",
  ">> Zugriffskontrolle offline...",
  ">> Datenkern wird heruntergefahren...",
  ">> Energiefluss wird getrennt...",
  ">> Verbindung zu Einsatznetzwerk getrennt...",
  ">> BRUTUS ist offline."
];

let index = 0;

function showNextLine() {
  if (index < lines.length) {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "logline";
    div.innerText = lines[index];
    log.appendChild(div);
    index++;
    setTimeout(showNextLine, 900);
  }
}

window.onload = showNextLine;
</script>

</head>
<body>

<h1>BRUTUS SYSTEMABSCHALTUNG</h1>

<div id="log"></div>

<div id="missionComplete">MISSION ERFOLGREICH ABGESCHLOSSEN</div>

<div id="restart">
  <a href="index.html">>> System neu starten</a>
</div>

</body>
</html>
