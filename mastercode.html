<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mastercode</title>
<link rel="stylesheet" href="style.css">

<audio id="alert" src="sounds/alert.mp3"></audio>
<audio id="success" src="sounds/success.mp3"></audio>
<audio id="tick" src="sounds/tick.mp3"></audio>

<style>
#successOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 255, 0, 0.85);
  color: black;
  font-size: 70px;
  font-weight: bold;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 9999;
  letter-spacing: 5px;
}
</style>

<script>
function brutusAlert() {
  const w = document.getElementById("brutusWarning");
  if (w) {
    w.style.display = "block";
    const a = document.getElementById("alert");
    if (a) a.play();
    setTimeout(() => w.style.display = "none", 5000);
  }
}

window.onload = brutusAlert;

function checkAnswer() {
  const input = document.getElementById("answer").value.trim().toLowerCase();
  if (input === "barry") {

    // Erfolgssound
    const s = document.getElementById("success");
    if (s) s.play();

    // Overlay anzeigen
    const overlay = document.getElementById("successOverlay");
    overlay.style.display = "flex";

    // Countdown starten
    startCountdown();

  } else {
    alert("Falsches Lösungswort!");
  }
}

function startCountdown() {
  let time = 10;
  const cd = document.getElementById("countdown");

  const interval = setInterval(() => {
    const t = document.getElementById("tick");
    if (t) t.play();

    cd.innerText = "Systemabschaltung in: " + time + " Sekunden";
    time--;

    if (time < 0) {
      clearInterval(interval);
      window.location.href = "index.html"; // oder Finale-Seite
    }
  }, 1000);
}
</script>
</head>

<body>

<div id="brutusWarning">⚠ BRUTUS WARNUNG: Unautorisierter Zugriff erkannt.</div>

<!-- Vollbild-Erfolgs-Overlay -->
<div id="successOverlay">BRUTUS ERFOLGREICH DEAKTIVIERT</div>

<h1>Mastercode – Finale</h1>

<div class="container">
  <p><strong>Einsatzkräfte:</strong><br>
  Sie haben in den vorherigen Sektoren Hinweise zur Abschaltung von BRUTUS erhalten.<br>
  Bitte kombinieren Sie die Hinweise zum Lösungswort.</p>

  <p><strong>Lösungswort eingeben:</strong></p>

  <input id="answer" placeholder="Lösungswort eingeben">
  <button onclick="checkAnswer()">Bestätigen</button>

  <div id="output"></div>
  <div id="countdown"></div>
</div>

</body>
</html>
