<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sektor 3</title>
<link rel="stylesheet" href="style.css">

<audio id="alert" src="sounds/alert.mp3"></audio>
<audio id="success" src="sounds/success.mp3"></audio>
<audio id="tick" src="sounds/tick.mp3"></audio>
</head>

<body>

<div id="brutusWarning" style="
  background:#8b0000;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  letter-spacing:0.1em;
  display:none;
">
  ⚠ BRUTUS WARNUNG: Unautorisierter Zugriff erkannt. Sicherheitsprotokoll aktiviert.
</div>

<script>
function brutusAlert() {
  const w = document.getElementById("brutusWarning");
  if (!w) return;

  w.style.display = "block";

  const a = document.getElementById("alert");
  if (a) a.play();

  // 15 Sekunden statt 5
  setTimeout(() => {
    w.style.display = "none";
  }, 15000);
}

window.onload = brutusAlert;
</script>

</body>
</html>
